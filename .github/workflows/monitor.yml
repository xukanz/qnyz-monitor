name: qnyz-monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分钟（GitHub 定时任务常有延迟，属正常）
  workflow_dispatch: {}       # 支持手动触发

permissions:
  contents: read

concurrency:
  group: qnyz-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # 一组失败不影响另一组
      matrix:
        include:
          - name: A            # 入住 9/5 → 离店 9/7
            config: config.ci.a.yaml
          - name: B            # 入住 9/7 → 离店 9/12
            config: config.ci.b.yaml
    name: check-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests PyYAML

      # 每组独立的去重缓存（key 前缀含组名，互不覆盖）
      - name: Restore dedup state (${{ matrix.name }})
        uses: actions/cache@v4
        with:
          path: state.json
          key: qnyz-state-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            qnyz-state-${{ matrix.name }}-

      - name: Run check (${{ matrix.name }})
        env:
          QNYZ_NOTIFY_URL: ${{ secrets.BARK_URL }}
        run: python monitor.py --once --config ${{ matrix.config }}
