name: qnyz-monitor

on:
  # ⚠️ GitHub 自带 schedule 已注释停用：本仓库实测它从未触发过
  # （官方不保证执行，高频 cron 常被整体跳过）。想试可取消下面两行注释。
  #
  # 真正的定时由【外部服务】(如 cron-job.org) 按固定间隔调用 GitHub API：
  #   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/monitor.yml/dispatches
  #   headers: Authorization: Bearer <PAT>, Accept: application/vnd.github+json
  #   body:    {"ref":"main"}
  # 该调用走的是下面的 workflow_dispatch 入口。详见 README。
  # schedule:
  #   - cron: "7,37 * * * *"
  workflow_dispatch: {}       # 手动触发 + 外部 API 定时触发（实际生效的入口）

permissions:
  contents: read

concurrency:
  group: qnyz-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # 一组失败不影响另一组
      matrix:
        include:
          - name: A            # 入住 9/5 → 离店 9/7
            config: config.ci.a.yaml
          # 暂停：恢复时取消下面两行注释
          # - name: B
          #   config: config.ci.b.yaml
    name: check-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests PyYAML

      # 每组独立的去重缓存（key 前缀含组名，互不覆盖）
      - name: Restore dedup state (${{ matrix.name }})
        uses: actions/cache@v4
        with:
          path: state.json
          key: qnyz-state-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            qnyz-state-${{ matrix.name }}-

      - name: Run check (${{ matrix.name }})
        env:
          QNYZ_NOTIFY_URL: ${{ secrets.BARK_URL }}
        run: python monitor.py --once --config ${{ matrix.config }}
